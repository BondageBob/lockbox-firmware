; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = nodemcuv2_unofficial

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
build_src_filter = +<*> -<.git/> -<.svn/> -<ESPmDNS>
lib_deps = 
	https://github.com/bblanchon/ArduinoJson.git @ 7.0.4
	https://github.com/me-no-dev/ESPAsyncWebServer.git
	https://github.com/alanswx/ESPAsyncWiFiManager

[env:nodemcuv2_release]
extends = env:nodemcuv2
build_flags = !./version.sh

[env:nodemcuv2_unofficial]
extends = env:nodemcuv2
build_flags = -DFIRMWARE_VERSION=\"unofficial\"


[env:lolin32]
platform = espressif32
board = lolin32
framework = arduino
board_build.filesystem = littlefs
build_src_filter = +<*> -<.git/> -<.svn/> -<ESP8266mDNS>
lib_deps = 
	https://github.com/bblanchon/ArduinoJson.git @ 7.0.4
	https://github.com/me-no-dev/ESPAsyncWebServer.git
	https://github.com/alanswx/ESPAsyncWiFiManager
	https://github.com/madhephaestus/ESP32Servo.git @ 0.13.0

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
board_build.filesystem = littlefs
build_src_filter = +<*> -<.git/> -<.svn/> -<ESP8266mDNS> -<ESPmDNS>
build_flags = -DCORE_DEBUG_LEVEL=5 -DFIRMWARE_VERSION=\"unofficial\" -DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=5 -DCONFIG_UNLOCK_PIN=0 -DCONFIG_SERVO_PIN=14
lib_deps = 
	https://github.com/bblanchon/ArduinoJson.git @ 7.1.0
	https://github.com/me-no-dev/ESPAsyncWebServer.git @ 1.2.4
	https://github.com/alanswx/ESPAsyncWiFiManager.git @ 0.31
	https://github.com/madhephaestus/ESP32Servo.git @ 3.0.5
	https://github.com/amcewen/HttpClient @ 2.2.0

[env:esp32-c3-devkitm-1]
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<.git/> -<.svn/> -<ESP8266mDNS> -<ESPmDNS>
build_flags =
	-DFIRMWARE_VERSION=\"unofficial\"
	-DCONFIG_UNLOCK_PIN=0
	-DCONFIG_SERVO_PIN=4
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=ESP_LOG_INFO
lib_deps = 
	https://github.com/bblanchon/ArduinoJson.git @ 7.1.0
	https://github.com/me-no-dev/ESPAsyncWebServer.git @ 1.2.4
	https://github.com/alanswx/ESPAsyncWiFiManager.git @ 0.31
	https://github.com/madhephaestus/ESP32Servo.git @ 3.0.5
	https://github.com/amcewen/HttpClient @ 2.2.0
